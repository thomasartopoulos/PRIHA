<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada · PRIHA</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="logo_priha.jpg" type="image/jpeg">
  <meta name="theme-color" content="#262425">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --tinta:#262425; --naranja:#d77439; --ladrillo:#b85a22; --campo:#2c3d33; }
    *{ box-sizing:border-box; }
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#fff; color:var(--tinta);
      font-family:'Barlow', ui-sans-serif, system-ui, sans-serif;
      padding:2rem; text-align:center;
    }
    .wrap{ max-width:640px; }
    img{ max-width:320px; width:100%; height:auto; margin-bottom:2.5rem; }
    .cod{
      font-family:'Oswald', 'Arial Narrow', sans-serif; font-weight:700;
      font-size:clamp(4rem, 14vw, 7rem); line-height:1; color:var(--naranja); margin:0;
    }
    h1{
      font-family:'Oswald', 'Arial Narrow', sans-serif; font-weight:500;
      font-size:clamp(1.4rem, 4vw, 2rem); margin:.5rem 0 1rem; text-transform:uppercase; letter-spacing:.02em;
    }
    p{ font-size:1.05rem; line-height:1.6; color:#4a4749; margin:0 0 2rem; }
    a.btn{
      display:inline-block; background:var(--campo); color:#fff; text-decoration:none;
      padding:.85rem 1.9rem; border-radius:2px; font-weight:600; letter-spacing:.03em;
      text-transform:uppercase; font-size:.95rem; transition:background .2s;
    }
    a.btn:hover{ background:var(--ladrillo); }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="logo_priha.jpg" alt="PRIHA · Programa de Investigaciones sobre Historia Agraria">
    <p class="cod">404</p>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté roto o que el contenido haya cambiado de lugar.</p>
    <a class="btn" href="./">Volver al inicio</a>
  </div>
</body>
</html>
